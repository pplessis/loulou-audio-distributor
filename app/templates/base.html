<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Loulou Audio Distributor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}" type="image/x-icon">
</head>
<body>
    <header>
        <h1>📚 Loulou Audio Distributor</h1>
        <p>Des histoires pour s'endormir en douceur...</p>
        <div class="auth-nav">
            {% if user and user.is_authenticated %}
                <span>👤 {{ user.username }}</span>
                <a href="{{ url_for('logout') }}">Se déconnecter</a>
            {% else %}
                <a href="{{ url_for('login_page') }}">Se connecter / S'inscrire</a>
            {% endif %}
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>© 2026 - Un projet pour Loulou 💙</p>
    </footer>
</body>
</html>
